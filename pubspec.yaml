name: signalbutton
description: push button signal simulator
publish_to: 'none'
version: 1.2.13+34

environment:
  # 3.47 is the floor, not 3.3: Android Gradle Plugin 9 rejects the Kotlin
  # Gradle Plugin being applied on top, and Flutter forces it onto plugin
  # modules until 3.47 adds the isBuiltInKotlinEnabled guard. Declaring 3.3
  # let `pub get` succeed and the Android build fail later with an error
  # that names neither.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter_android: ^4.14.1
  webview_flutter: ^4.14.1
  # Firebase Analytics
  firebase_core: 4.14.0
  firebase_analytics: 12.5.0
  # App Icon
  cupertino_icons: ^1.0.9
  flutter_launcher_icons: ^0.14.4
  # Audio Player
  just_audio: ^0.10.6
  # Vibration
  vibration: ^3.2.1
  # Text to Speech
  # Fork of pub.dev flutter_tts 4.2.5. Upstream has no Swift Package Manager
  # support and its last commit was 2026-01-05, so waiting for it would keep
  # CocoaPods in the iOS build. Changes from the published 4.2.5:
  #   ios/flutter_tts/, macos/flutter_tts/   SPM manifests, added
  #   android/build.gradle                   branch on android.builtInKotlin so
  #                                          AGP 9 compiles the Kotlin itself
  #   example/, gen/, test/                  removed; not needed to build
  # The Dart sources are unchanged. `diff -rq` against the pub-cache copy shows
  # exactly the five entries above.
  flutter_tts:
    path: packages/flutter_tts
  # Settings
  flutter_settings_screens: ^0.3.4
  settings_ui: ^3.0.1
  # SharedPreference
  shared_preferences: ^2.5.5
  # Admob
  google_mobile_ads: ^9.1.0
  # Device locale
  devicelocale: ^0.9.1
  # Localize
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  #env
  flutter_dotenv: ^6.0.1
  # Revenue Cat
  purchases_flutter: ^10.11.0
  #MVVM
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  # App Splash (runtime use in lib/)
  flutter_native_splash: ^2.4.8

# 2.6.0 ships no Package.swift while 2.5.1 does, and a single plugin without one
# makes Flutter fall back to CocoaPods for the whole iOS build
# (darwin_dependency_management.dart:89). Lift when SPM support returns.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  image_path: "assets/images/icon.png"
  android: true
  ios: true
  adaptive_icon_background: "#373635"
  adaptive_icon_foreground: "assets/images/appIcon.png"

flutter_native_splash:
  image: "assets/images/human.png"
  color: "373635"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/pedestrian/us/
    - assets/images/pedestrian/jp/
    - assets/images/pedestrian/uk/
    - assets/images/pedestrian/au/
    - assets/images/traffic/us/
    - assets/images/traffic/jp/
    - assets/images/traffic/uk/
    - assets/images/traffic/au/
    - assets/audios/
    - assets/.env

  fonts:
    - family: freeTfb
      fonts:
        - asset: assets/fonts/freetfb.ttf
    - family: beon
      fonts:
        - asset: assets/fonts/beon.ttf
    #For English font
    - family: roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
    #For Japanese font
    - family: notoJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Bold.ttf
    #For Chinese font
    - family: notoSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Bold.ttf

