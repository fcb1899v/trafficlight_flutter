name: signalbutton
description: push button signal simulator
publish_to: 'none'
version: 1.3.1+36

environment:
  # 3.47 is the floor, not 3.3: Android Gradle Plugin 9 rejects the Kotlin
  # Gradle Plugin being applied on top, and Flutter forces it onto plugin
  # modules until 3.47 adds the isBuiltInKotlinEnabled guard. Declaring 3.3
  # let `pub get` succeed and the Android build fail later with an error
  # that names neither.
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter_android: ^4.14.1
  # Firebase Analytics
  firebase_core: 4.14.0
  firebase_analytics: 12.5.0
  # App Icon
  cupertino_icons: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  # Audio Player
  just_audio: ^0.10.6
  # Vibration
  vibration: ^3.2.1
  # Text to Speech
  # Fork of pub.dev flutter_tts 4.2.5. Upstream has no Swift Package Manager
  # support and its last commit was 2026-01-05, so waiting for it would keep
  # CocoaPods in the iOS build. Changes from the published 4.2.5:
  #   ios/flutter_tts/, macos/flutter_tts/   SPM manifests, added
  #   android/build.gradle                   branch on android.builtInKotlin so
  #                                          AGP 9 compiles the Kotlin itself
  #   example/, gen/, test/                  removed; not needed to build
  # The Dart sources are unchanged. `diff -rq` against the pub-cache copy shows
  # exactly the five entries above.
  flutter_tts:
    path: packages/flutter_tts
  # Settings
  flutter_settings_screens: ^0.3.4
  settings_ui: ^4.0.1
  # SharedPreference
  shared_preferences: ^2.5.5
  # Admob
  google_mobile_ads: ^9.1.0
  # Device locale
  devicelocale: ^0.9.1
  # Localize
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  #env
  flutter_dotenv: ^6.0.1
  # Revenue Cat
  purchases_flutter: ^10.14.0
  #MVVM
  hooks_riverpod: ^3.4.3
  flutter_hooks: ^0.21.3+1
  # App Splash (runtime use in lib/)
  flutter_native_splash: ^2.4.8
  # Country flag SVG rendering
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  image_path: "assets/icon/icon.png"
  image_path_android: "assets/icon/icon_legacy.png"
  android: true
  ios: true
  adaptive_icon_background: "#57BFA3"
  adaptive_icon_foreground: "assets/icon/icon_android.png"

flutter_native_splash:
  image: "assets/icon/icon.png"
  color: "57BFA3"
  android_12:
    image: "assets/icon/icon_android.png"
    color: "57BFA3"

flutter:
  config:
    enable-swift-package-manager: true
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/pedestrian/us/
    - assets/images/pedestrian/jp/
    - assets/images/pedestrian/uk/
    - assets/images/pedestrian/au/
    - assets/images/pedestrian/nz/
    - assets/images/pedestrian/sg/
    - assets/images/pedestrian/ca/
    - assets/images/traffic/us/
    - assets/images/traffic/jp/
    - assets/images/traffic/uk/
    - assets/images/traffic/au/
    - assets/audios/
    - assets/.env

  fonts:
    - family: freeTfb
      fonts:
        - asset: assets/fonts/freetfb.ttf
    - family: beon
      fonts:
        - asset: assets/fonts/beon.ttf
    #For English font
    - family: roboto
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
    #For Japanese font
    - family: notoJP
      fonts:
        - asset: assets/fonts/NotoSansJP-Bold.ttf

